<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marca de Agua en Lote — Añadir Texto a Varias Fotos Gratis</title>
<meta name="description" content="Añade marcas de agua de texto a todas tus imágenes automáticamente. Protege tus fotos, 100% local, sin subida.">
<link rel="canonical" href="https://smartimgkit.com/es/tools/batch-watermark">
<link rel="stylesheet" href="/css/style.css?v=13">
</head>
<body>
<header class="site-header">
<a href="/es/" class="logo">SmartImgKit</a>
<nav><a href="/es/tools/">Herramientas</a><a href="/es/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>Marca de Agua por Lotes</h1>
<p class="lead">Añade automáticamente una marca de agua de texto personalizada a todas tus fotos, 100% local, sin subida y sin marcas de nuestra parte.</p>
<div class="upload-area" id="dropZone">
<p>Sube varias fotos para añadir la marca de agua</p>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
</div>
<div class="controls" style="margin:1rem 0;">
<input type="text" id="watermarkText" placeholder="Enter your watermark text (e.g. © YourName)" style="padding:0.5rem;width:100%;margin:0.5rem 0;">
<button id="downloadBtn" class="primary">Descargar todas las fotos con marca de agua</button>
</div>
<div id="preview" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.5rem;"></div>
</main>
<script>
let images = [];
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
images = [];
const preview = document.getElementById('preview');
preview.innerHTML = '';
Array.from(e.target.files).forEach((f,i) => {
const r = new FileReader();
r.onload = (ev) => {const img = new Image(); img.onload = () => {images.push(img); const c=document.createElement('canvas'); c.style.width='100%'; c.style.border='1px solid #333'; preview.appendChild(c); drawPreview(c, img);}; img.src = ev.target.result;};
r.readAsDataURL(f);
});
};
function drawPreview(c, img) {
c.width=img.width; c.height=img.height; const ctx=c.getContext('2d');
ctx.drawImage(img,0,0);
ctx.font='20px sans-serif'; ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillText(document.getElementById('watermarkText').value, 10, c.height-10);
}
document.getElementById('downloadBtn').onclick = () => {
images.forEach((img,i) => {
const c=document.createElement('canvas'); c.width=img.width; c.height=img.height; const ctx=c.getContext('2d');
ctx.drawImage(img,0,0); ctx.font='20px sans-serif'; ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillText(document.getElementById('watermarkText').value,10,c.height-10);
const a=document.createElement('a'); a.download='watermarked_'+i+'.jpg'; a.href=c.toDataURL('image/jpeg'); a.click();
});
};
</script>
</body>
</html>
