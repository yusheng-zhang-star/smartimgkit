<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprimir SVG Online Gratis — Optimizar Archivos SVG</title>
<meta name="description" content="Compresor de SVG online gratis. Minifica y optimiza archivos SVG vectoriales, reduce el tamaño al instante, sin subida.">
<link rel="canonical" href="https://smartimgkit.com/es/tools/svg-compressor">
<link rel="stylesheet" href="/css/style.css?v=14">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Compresor de SVG",
  "url": "https://smartimgkit.com/es/tools/svg-compressor",
  "inLanguage": "es",
  "description": "Compresor de SVG online gratis. Minifica y optimiza archivos SVG vectoriales, reduce el tamaño al instante, sin subida.",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Any",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<body>
<header class="site-header">
<a href="/es/" class="logo">SmartImgKit</a>
<nav><a href="/es/tools/">Herramientas</a><a href="/es/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>Compresor de SVG Gratis</h1>
<p class="lead">Minifica archivos SVG vectoriales eliminando espacios y metadatos innecesarios, 100% local, sin subida.</p>
<div class="upload-area" id="dropZone">
<p>Sube tu archivo SVG para comprimir</p>
<input type="file" id="fileInput" accept=".svg,image/svg+xml" hidden>
</div>
<div class="result" style="margin:1rem 0;">
<p>Original size: <span id="origSize">-</span></p>
<p>Compressed size: <span id="newSize">-</span></p>
<p>Savings: <span id="savings">-</span></p>
<button id="downloadBtn" class="primary">Descargar SVG comprimido</button>
</div>
</main>
<script>
let compressed = '';
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
const f = e.target.files[0];
const reader = new FileReader();
reader.onload = (ev) => {
const svg = ev.target.result;
document.getElementById('origSize').textContent = (f.size/1024).toFixed(2) + ' KB';
compressed = svg.replace(/\s+/g, ' ').replace(/>\s+</g, '><').trim();
const newSize = new Blob([compressed]).size;
document.getElementById('newSize').textContent = (newSize/1024).toFixed(2) + ' KB';
document.getElementById('savings').textContent = Math.round((1-newSize/f.size)*100) + '% smaller';
};
reader.readAsText(f);
};
document.getElementById('downloadBtn').onclick = () => {
const blob = new Blob([compressed], {type:'image/svg+xml'});
const a = document.createElement('a');
a.download = 'compressed.svg';
a.href = URL.createObjectURL(blob);
a.click();
};
</script>
</body>
</html>
