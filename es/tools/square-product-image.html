<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagen Cuadrada 1:1 Automática — Fotos de Producto Amazon/Etsy</title>
<meta name="description" content="Centra y rellena automáticamente tus fotos de producto en un fondo blanco cuadrado 1:1, perfecto para Amazon, Etsy y Shopify. Gratis y sin subida.">
<link rel="canonical" href="https://smartimgkit.com/es/tools/square-product-image">
<link rel="stylesheet" href="/css/style.css?v=13">
</head>
<body>
<header class="site-header">
<a href="/es/" class="logo">SmartImgKit</a>
<nav><a href="/es/tools/">Herramientas</a><a href="/es/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>Foto de Producto Cuadrada Automática</h1>
<p class="lead">Centra automáticamente tu foto de producto sobre un fondo blanco cuadrado 1:1, sin ajustes manuales. Perfecto para Amazon, Etsy y Shopify. Procesamiento 100% local, sin subida.</p>
<div class="upload-area" id="dropZone">
<p>Sube tu foto de producto</p>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<div class="controls" style="margin:1rem 0;">
<label>Output Size: <select id="sizeSelect">
<option value="1000">1000x1000</option>
<option value="2000" selected>2000x2000</option>
<option value="3000">3000x3000</option>
</select></label>
<label>Background: <select id="bgSelect">
<option value="#ffffff" selected>White</option>
<option value="#000000">Black</option>
<option value="transparent">Transparent</option>
</select></label>
<button id="downloadBtn" class="primary">Descargar imagen cuadrada</button>
</div>
<canvas id="canvas" style="max-width:500px;border:1px solid #333;"></canvas>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{img.onload=()=>{draw();};img.src=ev.target.result;}; r.readAsDataURL(f);};
function draw() {
const size = parseInt(document.getElementById('sizeSelect').value);
const bg = document.getElementById('bgSelect').value;
canvas.width = size; canvas.height = size;
if(bg !== 'transparent') {
ctx.fillStyle = bg;
ctx.fillRect(0,0,size,size);
}
const scale = Math.min(size/img.width, size/img.height) * 0.9;
const w = img.width*scale, h = img.height*scale;
const x = (size-w)/2, y = (size-h)/2;
ctx.drawImage(img, x, y, w, h);
}
document.getElementById('sizeSelect').onchange = draw;
document.getElementById('bgSelect').onchange = draw;
document.getElementById('downloadBtn').onclick = () => {const a=document.createElement('a');a.download='square-product.png';a.href=canvas.toDataURL('image/png');a.click();};
</script>
</body>
</html>
