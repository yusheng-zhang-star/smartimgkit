<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enderezar Fotos Online Gratis — Corregir Fotos Torcidas</title>
<meta name="description" content="Endereza fotos torcidas online gratis. Rota imágenes en ángulos pequeños para corregir horizontes inclinados, sin subida.">
<link rel="canonical" href="https://smartimgkit.com/es/tools/photo-straightener">
<link rel="stylesheet" href="/css/style.css?v=14">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Enderezar Fotos",
  "url": "https://smartimgkit.com/es/tools/photo-straightener",
  "inLanguage": "es",
  "description": "Endereza fotos torcidas online gratis. Rota imágenes en ángulos pequeños para corregir horizontes inclinados, sin subida.",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Any",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<body>
<header class="site-header">
<a href="/es/" class="logo">SmartImgKit</a>
<nav><a href="/es/tools/">Herramientas</a><a href="/es/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>Enderezar Fotos</h1>
<p class="lead">Rota fotos en ángulos pequeños para corregir horizontes torcidos y tomas inclinadas, 100% local, sin subida.</p>
<div class="upload-area" id="dropZone">
<p>Sube aquí tu foto torcida</p>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<div class="controls" style="margin:1rem 0;">
<label>Rotation Angle: <input type="range" id="angle" min="-45" max="45" value="0"> <span id="angleVal">0°</span></label>
<button id="downloadBtn" class="primary">Descargar foto enderezada</button>
</div>
<canvas id="canvas" style="max-width:100%;border:1px solid #333;"></canvas>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{img.onload=()=>{canvas.width=img.width;canvas.height=img.height;draw();};img.src=ev.target.result;}; r.readAsDataURL(f);};
function draw() {
const angle = parseInt(document.getElementById('angle').value);
document.getElementById('angleVal').textContent = angle + '°';
ctx.save();
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.translate(canvas.width/2, canvas.height/2);
ctx.rotate(angle * Math.PI/180);
ctx.drawImage(img, -img.width/2, -img.height/2);
ctx.restore();
}
document.getElementById('angle').oninput = draw;
document.getElementById('downloadBtn').onclick = () => {const a=document.createElement('a');a.download='straightened.jpg';a.href=canvas.toDataURL('image/jpeg');a.click();};
</script>
</body>
</html>
