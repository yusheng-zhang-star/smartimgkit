<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertir Foto a Pixel Art 8-bit Online Gratis</title>
<meta name="description" content="Convierte cualquier foto al estilo pixel art 8-bit al instante. Conversor de pixel art gratis online, procesamiento local sin subida.">
<link rel="canonical" href="https://smartimgkit.com/es/tools/pixel-art-converter">
<link rel="stylesheet" href="/css/style.css?v=14">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Convertir Foto a Pixel Art",
  "url": "https://smartimgkit.com/es/tools/pixel-art-converter",
  "inLanguage": "es",
  "description": "Convierte cualquier foto al estilo pixel art 8-bit al instante. Conversor de pixel art gratis online, procesamiento local sin subida.",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Any",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<body>
<header class="site-header">
<a href="/es/" class="logo">SmartImgKit</a>
<nav><a href="/es/tools/">Herramientas</a><a href="/es/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>Convertir Foto a Pixel Art</h1>
<p class="lead">Convierte cualquier foto al estilo pixel art retro de 8 bits, 100% local, sin subida ni registro.</p>
<div class="upload-area" id="dropZone">
<p>Sube tu foto para convertirla en pixel art</p>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<div class="controls" style="margin:1rem 0;">
<label>Pixel Size: <input type="range" id="pixelSize" min="2" max="50" value="10"> <span id="sizeVal">10px</span></label>
<button id="downloadBtn" class="primary">Descargar pixel art</button>
</div>
<canvas id="canvas" style="max-width:100%;border:1px solid #333;"></canvas>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{img.onload=()=>{canvas.width=img.width;canvas.height=img.height;draw();};img.src=ev.target.result;}; r.readAsDataURL(f);};
function draw() {
const ps = parseInt(document.getElementById('pixelSize').value);
document.getElementById('sizeVal').textContent = ps+'px';
ctx.drawImage(img,0,0);
const w = canvas.width, h = canvas.height;
const temp = document.createElement('canvas');
temp.width = w/ps; temp.height = h/ps;
const tctx = temp.getContext('2d');
tctx.drawImage(img,0,0,w/ps,h/ps);
ctx.imageSmoothingEnabled = false;
ctx.drawImage(temp,0,0,w,h);
}
document.getElementById('pixelSize').oninput = draw;
document.getElementById('downloadBtn').onclick = () => {const a=document.createElement('a');a.download='pixel-art.png';a.href=canvas.toDataURL('image/png');a.click();};
</script>
</body>
</html>
