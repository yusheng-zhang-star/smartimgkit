<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Inversor de colores de imagen gratis online. Invierte los colores de tus fotos al efecto negativo al instante, 100% local, sin subida.">
<link rel="canonical" href="https://smartimgkit.com/es/tools/invert-image-colors">
<link rel="stylesheet" href="/css/style.css?v=14">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Invertir Colores de Imagen",
  "url": "https://smartimgkit.com/es/tools/invert-image-colors",
  "inLanguage": "es",
  "description": "Inversor de colores de imagen gratis online. Invierte los colores de tus fotos al efecto negativo al instante, 100% local, sin subida.",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Any",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<body>
<header class="site-header">
<a href="/es/" class="logo">SmartImgKit</a>
<nav><a href="/es/tools/">Herramientas</a><a href="/es/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>Invertir Colores de Imagen</h1>
<p class="lead">Invierte cualquier foto al estilo negativo al instante, procesamiento 100% local en tu navegador, sin subida ni registro.</p>
<div class="upload-area" id="dropZone">
<p>Sube tu foto para invertir los colores</p>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<button id="downloadBtn" class="primary" style="margin:1rem 0;">Descargar foto invertida</button>
<canvas id="canvas" style="max-width:100%;border:1px solid #333;"></canvas>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{const img=new Image(); img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0); const data=ctx.getImageData(0,0,canvas.width,canvas.height); const d=data.data; for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];} ctx.putImageData(data,0,0);};img.src=ev.target.result;}; r.readAsDataURL(f);};
document.getElementById('downloadBtn').onclick = () => {const a=document.createElement('a');a.download='inverted.png';a.href=canvas.toDataURL('image/png');a.click();};
</script>
</body>
</html>
