<!-- Before/After Preview -->
      <div class="before-after-preview" id="beforeAfterPreview" style="margin-bottom:20px;">
        <div class="before-after-label">✨ See what this tool can do</div>
        <div class="before-after-images">
          <div class="before-after-item">
            <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=400&q=80" alt="Before: original image" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('img-fallback')">
            <div class="before-after-item-caption before">Before: clear face</div>
          </div>
          <div class="before-after-item">
            <div style="height:160px;display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);border-radius:8px;">
              <span style="font-size:3rem;opacity:0.5;">👤</span>
            </div>
            <div class="before-after-item-caption after">After: face blurred</div>
          </div>
        </div>
      </div>

      <div class="tool-flex">
          <!-- Upload -->
          <input type="file" id="fileInput" accept="image/*" style="display:none;">
          <label for="fileInput" class="dropzone" id="dropzone">
            <div class="dropzone-icon">📤</div>
            <h3>Drop an image here</h3>
            <p>or click to browse. Supports JPG, PNG, WebP, BMP.</p>
          </label>

          <!-- Blur Mode -->
          <div class="card">
            <h3>Blur Mode</h3>
            <div class="mode-toggle">
              <button class="active" data-mode="blur" onclick="setBlurMode('blur', this)">Blur</button>
              <button data-mode="pixelate" onclick="setBlurMode('pixelate', this)">Pixelate</button>
              <button data-mode="blackbar" onclick="setBlurMode('blackbar', this)">Black Bar</button>
            </div>
          </div>

          <!-- Blur Controls -->
          <div class="card">
            <h3>Adjustment</h3>
            <div class="slider-group">
              <label>Blur Intensity <span class="slider-value" id="blurVal">15</span></label>
              <input type="range" id="blurSlider" min="1" max="50" value="15" oninput="updateBlur()">
            </div>
            <div class="slider-group">
              <label>Padding (%) <span class="slider-value" id="padVal">0</span></label>
              <input type="range" id="padSlider" min="0" max="50" value="0" oninput="updateBlur()">
            </div>
            <div class="detection-info" id="faceCount">Faces detected: 0</div>
          </div>

          <!-- Actions -->
          <div class="btn-group">
            <button class="btn btn-primary" id="downloadBtn" disabled onclick="downloadResult()">⬇️ Download</button>
            <button class="btn btn-secondary" id="resetBtn" disabled onclick="resetImage()">↺ Reset</button>
          </div>
        </div>

        <div class="tool-canvas-area">
          <div class="preview-wrapper" id="previewWrapper">
            <canvas id="previewCanvas"></canvas>
          </div>
        </div>
      </div>

      <!-- AdSense -->
