<div class="tool-workspace">
                <!-- Before/After Preview -->
        <div class="before-after-preview" id="beforeAfterPreview">
          <div class="before-after-label">✨ See what this tool can do</div>
          <div class="before-after-images">
            <div class="before-after-item">
              <img src="https://images.unsplash.com/photo-1493552152660-f915ab47ae9d?w=400&q=80" alt="Before" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('img-fallback')">
              <div class="before-after-item-caption before">Before</div>
            </div>
            <div class="before-after-item">
              <div style="height:160px;display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);border-radius:8px;">
                <span style="font-size:3rem;opacity:0.5;">🔄</span>
              </div>
              <div class="before-after-item-caption after">After — processed</div>
            </div>
          </div>
        </div>        <input type="file" id="fileInput" accept="image/*" style="display:none;">
      <label for="fileInput" class="dropzone" id="dropzone">
          <div class="dropzone-icon">📤</div>
          <h3>Drop an image here</h3>
          <p>or click to browse. Supports JPG, PNG, WebP, GIF, BMP, TIFF.</p>
      </label>
      <span class="sample-image-btn" role="button" tabindex="0" id="sampleBtn">🖼️ Try with a sample image</span>
        <div class="preview-area" id="previewArea">
          <div class="preview-container"><img id="previewImg" alt="Preview"></div>
          <div style="max-width:300px;margin:16px auto">
            <label style="color:var(--text-secondary);font-size:.85rem;margin-bottom:6px;display:block">Output Format</label>
            <select id="formatSelect">
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPG</option>
              <option value="image/webp">WebP</option>
              <option value="image/gif">GIF</option>
              <option value="image/bmp">BMP</option>
            </select>
          </div>
          <div class="tool-actions">
            <button class="btn btn-primary" id="convertBtn">🔄 Convert</button>
            <button class="btn btn-secondary hidden" id="downloadBtn">⬇️ Download</button>
            <button class="btn btn-secondary" id="resetBtn">🔄 New Image</button>
          </div>
          <div id="status" class="text-center mt-16" style="color:var(--text-secondary)"></div>
        </div>
      </div>
