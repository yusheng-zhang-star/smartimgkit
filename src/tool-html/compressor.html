<div class="tool-workspace">
                <!-- Before/After Preview -->
        <div class="before-after-preview" id="beforeAfterPreview">
          <div class="before-after-label">✨ See what this tool can do</div>
          <div class="before-after-images">
            <div class="before-after-item">
              <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400&q=80" alt="Before" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('img-fallback')">
              <div class="before-after-item-caption before">Before</div>
            </div>
            <div class="before-after-item">
              <div style="height:160px;display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);border-radius:8px;">
                <span style="font-size:3rem;opacity:0.5;">📦</span>
              </div>
              <div class="before-after-item-caption after">After — processed</div>
            </div>
          </div>
        </div>        <input type="file" id="fileInput" accept="image/*" style="display:none;">
      <label for="fileInput" class="dropzone" id="dropzone">
          <div class="dropzone-icon">📤</div>
          <h3>Drop images here</h3>
          <p>or click to browse. Supports JPG, PNG, WebP.</p>
      </label>
      <span class="sample-image-btn" role="button" tabindex="0" id="sampleBtn">🖼️ Try with a sample image</span>
        <div class="preview-area" id="previewArea">
          <div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin-bottom:16px">
            <div style="flex:1;min-width:220px">
              <p style="color:var(--text-muted);font-size:.8rem;margin-bottom:8px">Original</p>
              <div class="preview-container"><img id="origImg" alt="Original"></div>
              <p id="origSize" style="text-align:center;color:var(--text-secondary);font-size:.85rem;margin-top:8px"></p>
            </div>
            <div style="flex:1;min-width:220px">
              <p style="color:var(--text-muted);font-size:.8rem;margin-bottom:8px">Compressed</p>
              <div class="preview-container"><img id="compImg" alt="Compressed"></div>
              <p id="compSize" style="text-align:center;color:var(--text-secondary);font-size:.85rem;margin-top:8px"></p>
            </div>
          </div>
          <div style="max-width:400px;margin:0 auto 16px">
            <label style="display:flex;justify-content:space-between;color:var(--text-secondary);font-size:.85rem;margin-bottom:6px">
              <span>Quality</span><span id="qualityVal">80%</span>
            </label>
            <input type="range" id="qualityRange" min="10" max="95" value="80">
          </div>
          <div class="tool-actions">
            <button class="btn btn-primary" id="compressBtn">🗜️ Compress</button>
            <button class="btn btn-secondary hidden" id="downloadBtn">⬇️ Download</button>
            <button class="btn btn-secondary" id="resetBtn">🔄 New Image</button>
          </div>
          <div id="status" class="text-center mt-16" style="color:var(--text-secondary)"></div>
        </div>
      </div>
