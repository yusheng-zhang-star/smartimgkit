<div class="tool-workspace">
                <!-- Before/After Preview -->
        <div class="before-after-preview" id="beforeAfterPreview">
          <div class="before-after-label">✨ See what this tool can do</div>
          <div class="before-after-images">
            <div class="before-after-item">
              <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&q=80" alt="Before" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('img-fallback')">
              <div class="before-after-item-caption before">Before</div>
            </div>
            <div class="before-after-item">
              <div style="height:160px;display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);border-radius:8px;">
                <span style="font-size:3rem;opacity:0.5;">✂️</span>
              </div>
              <div class="before-after-item-caption after">After — processed</div>
            </div>
          </div>
        </div>        <input type="file" id="fileInput" accept="image/*" style="display:none;">
      <label for="fileInput" class="dropzone" id="dropzone">
          <div class="dropzone-icon">📤</div>
          <h3>Drop an image here</h3>
          <p>or click to browse. Supports JPG, PNG, WebP.</p>
      </label>
      <span class="sample-image-btn" role="button" tabindex="0" id="sampleBtn">🖼️ Try with a sample image</span>
        <div class="preview-area" id="previewArea">
          <div style="text-align:center;margin-bottom:12px">
            <select id="ratioSelect" style="max-width:220px;display:inline-block">
              <option value="free">Free Form</option>
              <option value="1:1">1:1 Square</option>
              <option value="4:3">4:3 Standard</option>
              <option value="16:9">16:9 Widescreen</option>
              <option value="3:2">3:2 Photo</option>
              <option value="9:16">9:16 Story/Reel</option>
            </select>
          </div>
          <div class="preview-container" style="position:relative;overflow:hidden">
            <div class="crop-wrapper" id="cropWrapper">
              <img id="sourceImg" style="max-width:100%;display:block">
              <div class="crop-overlay" id="cropOverlay">
                <div class="crop-handle nw"></div><div class="crop-handle ne"></div>
                <div class="crop-handle sw"></div><div class="crop-handle se"></div>
              </div>
            </div>
          </div>
          <div class="tool-actions">
            <button class="btn btn-primary" id="cropBtn">✂️ Crop</button>
            <button class="btn btn-secondary hidden" id="downloadBtn">⬇️ Download</button>
            <button class="btn btn-secondary" id="resetBtn">🔄 New Image</button>
          </div>
          <div id="status" class="text-center mt-16" style="color:var(--text-secondary)"></div>
        </div>
      </div>
