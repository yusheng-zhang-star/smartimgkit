<!-- Upload -->
      <input type="file" id="fileInput" accept="image/*,.heic,.heif,.tiff,.tif" style="display:none;">
          <label for="fileInput" class="dropzone" id="dropzone" style="margin-bottom:20px">
        <div class="upload-icon">📁</div>
        <div class="upload-text">Click or drag image here to view metadata</div>
        <div class="upload-hint">JPG, PNG, WebP, HEIC, TIFF —Max 50MB</div>
      </label>
      <!-- Results (hidden until loaded) -->
      <div id="resultsSection" style="display:none;">
        <div class="preview-section">
          <div class="preview-left">
            <div class="preview-wrapper" id="previewWrapper">
              <img id="previewImg" src="" alt="Preview">
            </div>
            <div class="btn-group">
              <button class="btn btn-secondary" onclick="downloadClean()" id="cleanBtn">🧹Remove Metadata</button>
              <button class="btn btn-secondary" onclick="downloadJSON()" id="jsonBtn">📦 Export JSON</button>
            </div>
          </div>
          <div class="preview-right">
            <div class="warning-box" id="privacyWarning" style="display:none;">
              ⚠️ This image contains GPS location data. Be careful when sharing it online.
            </div>
            <div class="meta-sections" id="metaSections">
              <div class="no-meta">No metadata detected. Try uploading a JPG photo taken with a camera or smartphone.</div>
            </div>
          </div>
        </div>
      </div>

      <!-- AdSense -->
