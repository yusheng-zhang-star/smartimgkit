<div class="tool-workspace">
        <!-- Before/After Preview -->
        <div class="before-after-preview" id="beforeAfterPreview">
          <div class="before-after-label">✨ See what this tool can do</div>
          <div class="before-after-images">
            <div class="before-after-item">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&q=80" alt="Before: original image with background" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('img-fallback')">
              <div class="before-after-item-caption before">Before</div>
            </div>
            <div class="before-after-item">
              <div style="height:160px;position:relative;border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#ddd 0% 25%,#f5f5f5 0% 50%) 50%/14px 14px;">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&q=80" alt="After: image with transparent background" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover;-webkit-mask-image:radial-gradient(ellipse 38% 48% at 50% 36%,#000 52%,rgba(0,0,0,.6) 70%,rgba(0,0,0,.15) 85%,transparent 100%);mask-image:radial-gradient(ellipse 38% 48% at 50% 36%,#000 52%,rgba(0,0,0,.6) 70%,rgba(0,0,0,.15) 85%,transparent 100%);" onerror="this.style.display='none';this.parentElement.classList.add('img-fallback')">
              </div>
              <div class="before-after-item-caption after">After — transparent PNG</div>
            </div>
          </div>
        </div>

        <input type="file" id="fileInput" accept="image/*" style="display:none;">
      <label for="fileInput" class="dropzone" id="dropzone">
          <div class="dropzone-icon">📤</div>
          <h3>Drop an image here</h3>
          <p>or click to browse. Supports JPG, PNG, WebP. Max 10MB. Works best with portraits & product photos.</p>
      </label>
      <span class="sample-image-btn" role="button" tabindex="0" id="sampleBtn">🖼️ Try with a sample image</span>

        <div class="preview-area" id="previewArea">
          <div class="preview-container">
            <img id="previewImg" alt="Preview">
          </div>
          <div class="tool-actions">
            <button class="btn btn-primary" id="removeBtn">🪄 Remove Background</button>
            <button class="btn btn-secondary hidden" id="downloadBtn">⬇️ Download PNG</button>
            <button class="btn btn-secondary" id="resetBtn">🔄 New Image</button>
          </div>
          <div class="model-selector" id="modelSelector">
            <label>Model Quality:</label>
            <div class="model-options">
              <button class="model-btn" data-model="isnet_quint8" title="Small model (~42MB). Faster download, lower edge quality.">⚡ Fast</button>
              <button class="model-btn active" data-model="isnet_fp16" title="Medium model (~84MB). Balanced speed and quality." id="defaultModelBtn">⚖️ Balanced</button>
              <button class="model-btn" data-model="isnet" title="Large model (~168MB). Best edge quality, slower.">🎯 Quality</button>
            </div>
            <p class="model-note">Tip: For best results with documents, certificates, or text-heavy images, use 🎯 Quality mode.</p>
          </div>
          <div id="status" class="text-center mt-16" style="color:var(--text-secondary)"></div>
          <div id="resultArea" class="preview-container hidden" style="margin-top:16px">
            <img id="resultImg" alt="Result">
          </div>
          <!-- Next Step -->
          <div class="next-step-section" id="nextStepSection">
            <div class="next-step-label">✨ What's next?</div>
            <div class="next-step-buttons">
              <a href="/tools/compressor.html" class="next-step-btn"><span class="btn-icon">🗜️</span> Compress Result <span class="btn-arrow">→</span></a>
              <a href="/tools/converter.html" class="next-step-btn"><span class="btn-icon">🔄</span> Convert to WebP <span class="btn-arrow">→</span></a>
              <a href="/tools/watermark.html" class="next-step-btn"><span class="btn-icon">🔏</span> Add Watermark <span class="btn-arrow">→</span></a>
            </div>
          </div>
        </div>
      </div>
