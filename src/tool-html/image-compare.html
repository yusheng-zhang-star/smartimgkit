<div class="compare-layout">

          <div class="compare-sidebar">
            <div>
              <label style="font-size:.8rem;color:var(--text-secondary);font-weight:500;display:block;margin-bottom:8px;">1. Upload Images</label>
              <div class="upload-pair">
                <input type="file" id="fileA" accept="image/*" style="display:none;">
                <label for="fileA" class="upload-half" id="uploadA">
                  <div class="upload-icon">📤</div>
                  <div class="upload-label">Before / Image A</div>
                </label>
                <input type="file" id="fileB" accept="image/*" style="display:none;">
                <label for="fileB" class="upload-half" id="uploadB">
                  <div class="upload-icon">📤</div>
                  <div class="upload-label">After / Image B</div>
                </label>
      <span class="sample-image-btn" role="button" tabindex="0" id="sampleBtn">🖼️ Try with a sample image</span>
      <span class="sample-image-btn" role="button" tabindex="0" id="sampleBtn">🖼️ Try with a sample image</span>
              </div>
              <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:12px;">
                <span class="sample-image-btn" role="button" tabindex="0" id="sampleBtnA">🖼️ Try sample A</span>
                <span class="sample-image-btn" role="button" tabindex="0" id="sampleBtnB">🖼️ Try sample B</span>
              </div>
            </div>

            <div>
              <label style="font-size:.8rem;color:var(--text-secondary);font-weight:500;display:block;margin-bottom:8px;">2. Comparison Mode</label>
              <div class="mode-btns">
                <button class="mode-btn active" data-mode="slider">Slider</button>
                <button class="mode-btn" data-mode="sidebyside">Side by Side</button>
                <button class="mode-btn" data-mode="overlay">Overlay</button>
              </div>
            </div>

            <div class="tool-actions" style="flex-direction:column;">
              <button class="btn btn-primary" id="downloadBtn" style="display:none;">💾 Download Comparison</button>
              <button class="btn btn-secondary" id="resetBtn">🔄 Reset All</button>
            </div>
            <div id="status" class="text-center" style="color:var(--text-secondary);font-size:.85rem;"></div>
          </div>

          <div class="compare-main">
            <div class="compare-preview" id="comparePreview">
              <p style="color:var(--text-muted);font-size:.9rem;">Upload two images to start comparing</p>
            </div>
            <div class="info-row" id="infoRow" style="display:none;">
              <span>📐 Image A: <b id="sizeA">-</b></span>
              <span>📐 Image B: <b id="sizeB">-</b></span>
            </div>
          </div>

        </div>
