<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Static Map Test</title>
  <style>
    body { padding: 20px; font-family: Arial, sans-serif; }
    .map-container { width: 800px; height: 500px; border: 2px solid red; position: relative; overflow: hidden; }
    .map-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .marker { position: absolute; width: 30px; height: 30px; background: #ef4444; border: 3px solid white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); top: 50%; left: 50%; margin-left: -15px; margin-top: -30px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .marker::after { content: ''; position: absolute; width: 10px; height: 10px; background: white; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg); }
    .log { margin-top: 10px; padding: 10px; background: #f0f0f0; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Static Map Test</h1>
  <p>Using static map image from OpenStreetMap. No JS map library needed.</p>
  <div class="map-container">
    <img src="https://staticmap.openstreetmap.de/staticmap.php?center=36.639,117.1425&zoom=13&size=800x500&maptype=mapnik" alt="Map" onerror="this.style.background='#ccc'; this.alt='Map load failed';">
    <div class="marker"></div>
  </div>
  <div class="log">
    Static map should display above. Marker is at center (36.639, 117.1425).<br>
    Click map to open interactive version on OpenStreetMap.
  </div>
</body>
</html>
