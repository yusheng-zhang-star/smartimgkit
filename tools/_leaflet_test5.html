<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leaflet Test - CartoDB Tiles</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 20px; font-family: Arial; background: #1a1a1a; color: white; }
    #map { width: 800px; height: 500px; background: #333; border: 2px solid red; }
    #log { margin-top: 10px; padding: 10px; background: #222; font-size: 12px; max-height: 200px; overflow-y: auto; }
    .marker-photo { width: 40px; height: 40px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.5); object-fit: cover; }
  </style>
</head>
<body>
  <h2>Leaflet Test - CartoDB Tiles + Photo Markers</h2>
  <div id="map"></div>
  <div id="log">Loading...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const log = document.getElementById('log');
    function addLog(msg) {
      log.innerHTML += msg + '<br>';
      log.scrollTop = log.scrollHeight;
    }

    window.onload = function() {
      addLog('Page loaded');
      addLog('Leaflet version: ' + (typeof L !== 'undefined' ? L.version : 'NOT LOADED'));

      try {
        const map = L.map('map', {
          center: [36.639, 117.1425],
          zoom: 12,
          zoomControl: true
        });
        addLog('Map created');

        // Use CartoDB tiles instead of OpenStreetMap
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
          maxZoom: 19,
          subdomains: 'abcd'
        }).addTo(map);
        addLog('CartoDB tile layer added');

        // Force size recalculation
        setTimeout(() => {
          map.invalidateSize();
          addLog('invalidateSize called');
          addLog('Map size: ' + map.getSize().x + 'x' + map.getSize().y);
        }, 100);

        // Add photo markers
        const photos = [
          { lat: 36.639, lon: 117.1425, name: 'Jinan', color: '#4682B4' },
          { lat: 39.9163, lon: 116.3972, name: 'Beijing', color: '#CD853F' },
          { lat: 31.2397, lon: 121.4900, name: 'Shanghai', color: '#2E8B57' }
        ];

        photos.forEach(p => {
          // Create a colored circle as photo placeholder
          const icon = L.divIcon({
            className: 'custom-marker',
            html: '<div style="width:44px;height:44px;border-radius:50%;background:' + p.color + ';border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:12px;">' + p.name.charAt(0) + '</div>',
            iconSize: [44, 44],
            iconAnchor: [22, 22]
          });
          L.marker([p.lat, p.lon], { icon: icon }).addTo(map).bindPopup(p.name);
          addLog('Marker added: ' + p.name);
        });

        // Fit bounds to show all markers
        const bounds = L.latLngBounds(photos.map(p => [p.lat, p.lon]));
        map.fitBounds(bounds, { padding: [50, 50] });
        addLog('Fit bounds done');

      } catch(e) {
        addLog('ERROR: ' + e.message);
        addLog(e.stack);
      }
    };
  </script>
</body>
</html>
