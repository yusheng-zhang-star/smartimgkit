<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Product Image Studio — Free, No Upload | SmartImgKit</title>
<meta name="description" content="Make Amazon product photos with white background and shadow 100% free in your browser. No upload, no watermark, 1:1 main image ready.">
<link rel="canonical" href="https://smartimgkit.com/tools/amazon-product-image-studio.html">
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {font-family:system-ui,sans-serif; background:#f8fafc; color:#1e293b; line-height:1.6;}
.top {background:#1e3a8a; color:white; padding:1rem; position:sticky; top:0; z-index:100;}
.top-inner {max-width:1200px; margin:0 auto; display:flex; align-items:center;}
.top a {color:white; text-decoration:none; margin-right:1.5rem;}
.container {max-width:1000px; margin:2rem auto; padding:0 1rem;}
h1 {color:#1e3a8a; margin-bottom:1rem;}
.workspace {background:white; padding:2rem; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,0.08);}
.drop-zone {border:2px dashed #94a3b8; border-radius:12px; padding:3rem; text-align:center; margin:1.5rem 0; cursor:pointer;}
.drop-zone:hover {border-color:#1e3a8a; background:#eff6ff;}
button {background:#1e3a8a; color:white; border:none; padding:0.8rem 1.5rem; border-radius:8px; font-size:1rem; cursor:pointer; margin:0.5rem;}
button:hover {background:#1e40af;}
button:disabled {background:#94a3b8; cursor:not-allowed;}
#canvas-container {margin:1.5rem 0; text-align:center;}
canvas {max-width:100%; border:1px solid #e2e8f0; border-radius:8px;}
.controls {margin:1.5rem 0; display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
.control-group label {display:block; margin-bottom:0.3rem; font-weight:500;}
select, input[type=range] {width:100%; padding:0.5rem; border-radius:6px; border:1px solid #cbd5e1;}
.status {padding:1rem; border-radius:8px; background:#eff6ff; color:#1e3a8a; margin:1rem 0; display:none;}
</style>
</head>
<body>
<div class="top">
  <div class="top-inner">
    <a href="/" style="font-weight:800; font-size:1.2rem;">SmartImgKit</a>
    <a href="/tools/calculators/">All Tools</a>
    <a href="/blog/">Blog</a>
  </div>
</div>
<div class="container">
  <h1>Amazon Product Image Studio</h1>
  <p>Make perfect 1:1 white-background Amazon main photos in your browser. No upload, no watermark, 100% free.</p>
  <div class="workspace">
    <div class="drop-zone" id="dropZone">
      <p style="font-size:1.2rem; margin-bottom:0.5rem;">📸 Drop your product photo here, or click to upload</p>
      <p style="color:#64748b;">JPG/PNG up to 20MB</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
    <div class="status" id="status"></div>
    <div class="controls">
      <div class="control-group">
        <label>Background Color</label>
        <select id="bgColor">
          <option value="#ffffff">White (Amazon Main Image)</option>
          <option value="#f5f5f5">Light Gray</option>
          <option value="#000000">Black</option>
        </select>
      </div>
      <div class="control-group">
        <label>Shadow Intensity: <span id="shadowVal">30</span>%</label>
        <input type="range" id="shadow" min="0" max="100" value="30">
      </div>
      <div class="control-group">
        <label>Padding: <span id="paddingVal">85</span>%</label>
        <input type="range" id="padding" min="50" max="95" value="85">
      </div>
      <div class="control-group">
        <label>Output Size</label>
        <select id="outSize">
          <option value="2000,2000">2000x2000 (Amazon Recommended)</option>
          <option value="1000,1000">1000x1000</option>
          <option value="1500,1500">1500x1500</option>
        </select>
      </div>
    </div>
    <div style="text-align:center;">
      <button id="generateBtn" disabled>✨ Generate Amazon Photo</button>
      <button id="downloadBtn" disabled>⬇️ Download Image</button>
    </div>
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
  </div>
</div>
<script type="module">
let originalImage = null;
let resultBlob = null;
let removeModel = null;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const generateBtn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');
const status = document.getElementById('status');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if(e.target.files[0]) loadImage(e.target.files[0]);
});

async function loadImage(file) {
  status.style.display = 'block';
  status.textContent = 'Loading image...';
  const img = new Image();
  img.onload = () => {
    originalImage = img;
    status.textContent = 'Image loaded! Click Generate Amazon Photo.';
    generateBtn.disabled = false;
  };
  img.src = URL.createObjectURL(file);
}

generateBtn.addEventListener('click', async () => {
  if(!originalImage) return;
  generateBtn.disabled = true;
  status.style.display = 'block';
  status.textContent = 'Running local AI background removal... this takes 5-10 seconds.';
  
  if(!removeModel) {
    status.textContent = 'Loading AI model (first run only, cached after)...';
    const mod = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');
    removeModel = mod.removeBackground || mod.default;
  }

  const canvasTmp = document.createElement('canvas');
  canvasTmp.width = originalImage.width;
  canvasTmp.height = originalImage.height;
  const tctx = canvasTmp.getContext('2d');
  tctx.drawImage(originalImage, 0, 0);
  const blob = await new Promise(r => canvasTmp.toBlob(r));
  
  status.textContent = 'Processing...';
  const cutoutBlob = await removeModel(blob);
  const cutoutImg = new Image();
  cutoutImg.onload = () => {
    drawFinal(cutoutImg);
    status.textContent = 'Done! Click Download Image to save.';
    generateBtn.disabled = false;
    downloadBtn.disabled = false;
  };
  cutoutImg.src = URL.createObjectURL(cutoutBlob);
});

function drawFinal(cutoutImg) {
  const [w, h] = document.getElementById('outSize').value.split(',').map(Number);
  canvas.width = w;
  canvas.height = h;
  const bgColor = document.getElementById('bgColor').value;
  const shadow = document.getElementById('shadow').value / 100;
  const pad = document.getElementById('padding').value / 100;

  ctx.fillStyle = bgColor;
  ctx.fillRect(0,0,w,h);

  const maxSize = Math.min(w,h) * pad;
  const ratio = Math.min(maxSize / cutoutImg.width, maxSize / cutoutImg.height);
  const dw = cutoutImg.width * ratio;
  const dh = cutoutImg.height * ratio;
  const dx = (w - dw)/2;
  const dy = h - dh - 40;

  ctx.shadowColor = 'rgba(0,0,0,' + shadow + ')';
  ctx.shadowBlur = 20 * shadow;
  ctx.shadowOffsetY = 10 * shadow;
  ctx.drawImage(cutoutImg, dx, dy, dw, dh);
  ctx.shadowColor = 'transparent';

  resultBlob = null;
  canvas.toBlob((b) => resultBlob = b);
}

downloadBtn.addEventListener('click', () => {
  if(!resultBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(resultBlob);
  a.download = 'amazon-main-photo.png';
  a.click();
});
</script>
</body>
</html>
