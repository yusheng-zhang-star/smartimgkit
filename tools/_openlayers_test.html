<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OpenLayers Test</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openlayers/7.5.2/ol.css" />
  <style>
    body { padding: 20px; font-family: Arial, sans-serif; }
    .test-container { width: 800px; height: 500px; border: 2px solid red; }
    #ol-map { width: 100%; height: 100%; }
    .log { margin-top: 10px; padding: 10px; background: #f0f0f0; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>OpenLayers Test</h1>
  <p>Using OpenLayers 7.5.2 instead of Leaflet.</p>
  <div class="test-container">
    <div id="ol-map"></div>
  </div>
  <div class="log" id="log">Log:</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openlayers/7.5.2/ol.js"></script>
  <script>
    function log(msg) {
      document.getElementById('log').innerHTML += '<br>' + msg;
    }
    
    log('Initializing OpenLayers map...');
    
    var map = new ol.Map({
      target: 'ol-map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([117.1425, 36.639]),
        zoom: 13
      })
    });
    
    log('Map created.');
    
    // Add a marker
    var marker = new ol.Feature({
      geometry: new ol.geom.Point(ol.proj.fromLonLat([117.1425, 36.639]))
    });
    
    var vectorLayer = new ol.layer.Vector({
      source: new ol.source.Vector({
        features: [marker]
      })
    });
    
    map.addLayer(vectorLayer);
    log('Marker added at 36.639, 117.1425');
  </script>
</body>
</html>
