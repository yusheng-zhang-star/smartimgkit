<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Iframe Map Test</title>
  <style>
    body { padding: 20px; font-family: Arial, sans-serif; }
    .map-container { width: 800px; height: 500px; border: 2px solid red; }
    .map-container iframe { width: 100%; height: 100%; border: none; display: block; }
    .log { margin-top: 10px; padding: 10px; background: #f0f0f0; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Iframe Map Test</h1>
  <p>Using OpenStreetMap iframe embed. Fully interactive, isolated from page CSS/JS.</p>
  <div class="map-container">
    <iframe 
      src="https://www.openstreetmap.org/export/embed.html?bbox=117.10%2C36.60%2C117.18%2C36.68&layer=mapnik&marker=36.639%2C117.1425"
      loading="lazy">
    </iframe>
  </div>
  <div class="log">
    Iframe should display interactive map above with marker at 36.639, 117.1425.<br>
    You should be able to zoom and pan inside the map.
  </div>
</body>
</html>
