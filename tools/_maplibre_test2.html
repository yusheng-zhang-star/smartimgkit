<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MapLibre Test - Photo Markers v2</title>
  <link href="../js/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #0f0f1a; color: white; }
    .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
    h2 { color: #a5b4fc; }
    #map { width: 100%; height: 500px; border-radius: 12px; overflow: hidden; background: #1a1a2e; }
    #log { margin-top: 10px; padding: 10px; background: #1a1a2e; border-radius: 8px; font-size: 12px; max-height: 150px; overflow-y: auto; font-family: monospace; }
    .photo-marker { cursor: pointer; transition: transform 0.2s; }
    .photo-marker img { width: 52px; height: 52px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 12px rgba(0,0,0,0.6); object-fit: cover; display: block; }
    .photo-marker:hover img { transform: scale(1.15); border-color: #818cf8; }
    .photo-marker.selected img { width: 64px; height: 64px; border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,0.3), 0 4px 16px rgba(0,0,0,0.6); }
    .maplibregl-popup-content { background: #1a1a2e !important; color: white !important; border-radius: 12px !important; padding: 0 !important; border: 1px solid #374151 !important; box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important; }
    .maplibregl-popup-content img { width: 200px; height: 150px; object-fit: cover; border-radius: 12px 12px 0 0; display: block; }
    .popup-info { padding: 12px; }
    .popup-info h4 { margin: 0 0 6px 0; color: #a5b4fc; }
    .popup-info p { margin: 2px 0; font-size: 12px; color: #9ca3af; }
    .maplibregl-popup-close-button { color: white !important; font-size: 20px !important; padding: 4px 8px !important; }
    .fallback-note { margin-top: 10px; padding: 10px; background: #fef3c7; color: #92400e; border-radius: 8px; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🗺️ MapLibre + OpenFreeMap - Photo Markers v2</h2>
    <div id="map"></div>
    <div id="log">Initializing...</div>
    <div class="fallback-note" id="fallbackNote">⚠️ Map tiles may be blocked in your network. International users will see the full map. Photo markers should still be visible.</div>
  </div>

  <script src="../js/maplibre-gl.js"></script>
  <script>
    const log = document.getElementById('log');
    function addLog(msg) {
      log.innerHTML += msg + '<br>';
      log.scrollTop = log.scrollHeight;
    }

    function makePlaceholder(color, letter) {
      const canvas = document.createElement('canvas');
      canvas.width = 100; canvas.height = 100;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, 100, 100);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 40px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(letter, 50, 50);
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    const photos = [
      { name: 'Jinan Spring', lat: 36.639, lon: 117.1425, date: '2026-09-10', url: makePlaceholder('#4682B4', 'J') },
      { name: 'Beijing Forbidden City', lat: 39.9163, lon: 116.3972, date: '2026-09-08', url: makePlaceholder('#CD853F', 'B') },
      { name: 'Shanghai Bund', lat: 31.2397, lon: 121.4900, date: '2026-09-05', url: makePlaceholder('#2E8B57', 'S') },
      { name: 'Guangzhou Tower', lat: 23.1066, lon: 113.3245, date: '2026-09-02', url: makePlaceholder('#DC143C', 'G') }
    ];

    window.onload = function() {
      addLog('Page loaded');
      addLog('MapLibre: ' + (typeof maplibregl !== 'undefined' ? maplibregl.version : 'NOT LOADED'));

      if (typeof maplibregl === 'undefined') {
        addLog('FATAL: MapLibre library not loaded!');
        return;
      }

      let map;
      try {
        map = new maplibregl.Map({
          container: 'map',
          style: 'https://tiles.openfreemap.org/styles/liberty',
          center: [117.0, 35.0],
          zoom: 4
        });
        addLog('Map object created');

        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        addLog('Navigation control added');

        // Add markers IMMEDIATELY, don't wait for tile load
        addPhotoMarkers();
        addLog('Photo markers added immediately');

        map.on('load', () => {
          addLog('✅ Map style loaded');
        });

        map.on('error', (e) => {
          addLog('Map error: ' + (e.error ? e.error.message : 'unknown'));
        });

        // Show fallback note after 5 seconds if style still loading
        setTimeout(() => {
          if (!map.loaded()) {
            addLog('⚠️ Tiles still loading (network may be blocked)');
            document.getElementById('fallbackNote').style.display = 'block';
          }
        }, 5000);

      } catch(e) {
        addLog('FATAL ERROR: ' + e.message);
        addLog(e.stack);
      }

      function addPhotoMarkers() {
        let added = 0;
        photos.forEach((photo, idx) => {
          try {
            const el = document.createElement('div');
            el.className = 'photo-marker';
            el.innerHTML = '<img src="' + photo.url + '" alt="' + photo.name + '">';
            
            const marker = new maplibregl.Marker({ element: el })
              .setLngLat([photo.lon, photo.lat])
              .setPopup(new maplibregl.Popup({ offset: 35, closeButton: true })
                .setHTML('<img src="' + photo.url + '"><div class="popup-info"><h4>' + photo.name + '</h4><p>📍 ' + photo.lat.toFixed(4) + ', ' + photo.lon.toFixed(4) + '</p><p>📅 ' + photo.date + '</p></div>'))
              .addTo(map);

            el.addEventListener('click', (e) => {
              e.stopPropagation();
              document.querySelectorAll('.photo-marker').forEach(m => m.classList.remove('selected'));
              el.classList.add('selected');
              map.flyTo({ center: [photo.lon, photo.lat], zoom: 12, essential: true });
            });

            added++;
            addLog('  Marker ' + (idx+1) + ': ' + photo.name + ' at ' + photo.lat + ',' + photo.lon);
          } catch(e) {
            addLog('  FAILED marker ' + photo.name + ': ' + e.message);
          }
        });

        addLog('✅ Total markers added: ' + added + '/' + photos.length);

        // Fit bounds
        try {
          const bounds = photos.map(p => [p.lon, p.lat]);
          const minLon = Math.min(...bounds.map(b => b[0])) - 3;
          const maxLon = Math.max(...bounds.map(b => b[0])) + 3;
          const minLat = Math.min(...bounds.map(b => b[1])) - 3;
          const maxLat = Math.max(...bounds.map(b => b[1])) + 3;
          map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 60, animate: false });
          addLog('Fit bounds set');
        } catch(e) {
          addLog('Fit bounds failed: ' + e.message);
        }
      }
    };
  </script>
</body>
</html>
