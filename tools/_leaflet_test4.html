<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leaflet Test 4 - No Animation + Different Init</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <style>
    body { padding: 20px; font-family: Arial, sans-serif; }
    .test-container { width: 800px; height: 500px; border: 2px solid red; position: relative; }
    #test-map4 { width: 800px; height: 500px; position: absolute; top: 0; left: 0; }
    .log { margin-top: 10px; padding: 10px; background: #f0f0f0; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Leaflet Test 4 - No Animation + cdnjs</h1>
  <p>Using cdnjs CDN, all animations disabled, map initialized after window load.</p>
  <div class="test-container">
    <div id="test-map4"></div>
  </div>
  <div class="log" id="log">Log:</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    function log(msg) {
      document.getElementById('log').innerHTML += '<br>' + msg;
    }
    
    window.onload = function() {
      log('Window loaded. Initializing map...');
      
      var map = L.map('test-map4', {
        zoomAnimation: false,
        fadeAnimation: false,
        markerZoomAnimation: false,
        zoomControl: true
      });
      
      log('Map created. Size: ' + map.getSize().x + 'x' + map.getSize().y);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19,
        noWrap: true
      }).addTo(map);
      
      map.setView([36.639, 117.1425], 13, { animate: false });
      log('setView called. Size: ' + map.getSize().x + 'x' + map.getSize().y);
      log('Map center: ' + map.getCenter().lat + ', ' + map.getCenter().lng);
      
      setTimeout(function() {
        map.invalidateSize({ animate: false });
        log('After invalidateSize. Size: ' + map.getSize().x + 'x' + map.getSize().y);
      }, 200);
    };
  </script>
</body>
</html>
