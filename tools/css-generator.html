  <style>
    .container{max-width:1200px;margin:2rem auto;padding:0 1rem;display:grid;grid-template-columns:300px 1fr;gap:2rem}
    @media(max-width:800px){.container{grid-template-columns:1fr}}

    .preview{background:repeating-conic-gradient(#2a2a2a 0% 25%, #1a1a1a 0% 50%) 50% / 20px 20px;border-radius:12px;min-height:400px;display:flex;align-items:center;justify-content:center;padding:2rem}

    .code{background:#0d1117;border-radius:8px;padding:1rem;font-family:monospace;font-size:.9rem;color:#7ee787;white-space:pre-wrap;word-break:break-all;margin-top:1rem;position:relative}
    .copy-btn{position:absolute;top:8px;right:8px;padding:4px 12px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.8rem}

    <div class="container">
      <div>
        <div class="tabs">
          <div class="tab active" onclick="setTab('shadow')">Box Shadow</div>
          <div class="tab" onclick="setTab('radius')">Border Radius</div>
        </div>

        <div class="panel" id="shadowPanel">
          <h3>Shadow Settings</h3>
          <div class="row">
            <label>Offset X <span id="vx">0</span></label>
            <input type="range" id="sx" min="-50" max="50" value="0" oninput="update()">
          </div>
          <div class="row">
            <label>Offset Y <span id="vy">10</span></label>
            <input type="range" id="sy" min="-50" max="50" value="10" oninput="update()">
          </div>
          <div class="row">
            <label>Blur <span id="vb">20</span></label>
            <input type="range" id="blur" min="0" max="100" value="20" oninput="update()">
          </div>
          <div class="row">
            <label>Spread <span id="vspd">0</span></label>
            <input type="range" id="spd" min="-20" max="50" value="0" oninput="update()">
          </div>
          <div class="row">
            <label>Opacity <span id="vo">20%</span></label>
            <input type="range" id="op" min="0" max="100" value="20" oninput="update()">
          </div>
          <div class="row">
            <label>Color</label>
            <input type="color" id="scolor" value="#000000" oninput="update()">
          </div>
        </div>

        <div class="panel" id="radiusPanel" style="display:none">
          <h3>Border Radius</h3>
          <div class="row">
            <label>Top Left <span id="rtl">8</span></label>
            <input type="range" id="tl" min="0" max="100" value="8" oninput="update()">
          </div>
          <div class="row">
            <label>Top Right <span id="rtr">8</span></label>
            <input type="range" id="tr" min="0" max="100" value="8" oninput="update()">
          </div>
          <div class="row">
            <label>Bottom Right <span id="rbr">8</span></label>
            <input type="range" id="br" min="0" max="100" value="8" oninput="update()">
          </div>
          <div class="row">
            <label>Bottom Left <span id="rbl">8</span></label>
            <input type="range" id="bl" min="0" max="100" value="8" oninput="update()">
          </div>
        </div>
      </div>

      <div>
        <div class="preview">
          <div id="previewBox"></div>
        </div>
        <div class="code" id="codeBox">
          <button class="copy-btn" onclick="copyCode()">Copy</button>
          <span id="codeText"></span>
        </div>
      </div>
    </div>
  </main>

  <script>
  function setTab(t) {
    document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('shadowPanel').style.display = t === 'shadow' ? 'block' : 'none';
    document.getElementById('radiusPanel').style.display = t === 'radius' ? 'block' : 'none';
    update();
  }

  function update() {
    const box = document.getElementById('previewBox');
    const sx = +document.getElementById('sx').value;
    const sy = +document.getElementById('sy').value;
    const blur = +document.getElementById('blur').value;
    const spd = +document.getElementById('spd').value;
    const op = +document.getElementById('op').value / 100;
    const color = document.getElementById('scolor').value;

    const tl = +document.getElementById('tl').value;
    const tr = +document.getElementById('tr').value;
    const br = +document.getElementById('br').value;
    const bl = +document.getElementById('bl').value;

    document.getElementById('vx').textContent = sx;
    document.getElementById('vy').textContent = sy;
    document.getElementById('vb').textContent = blur;
    document.getElementById('vspd').textContent = spd;
    document.getElementById('vo').textContent = op * 100 + '%';
    document.getElementById('rtl').textContent = tl;
    document.getElementById('rtr').textContent = tr;
    document.getElementById('rbr').textContent = br;
    document.getElementById('rbl').textContent = bl;

    // Convert hex to rgba
    const r = parseInt(color.slice(1,3), 16);
    const g = parseInt(color.slice(3,5), 16);
    const b = parseInt(color.slice(5,7), 16);

    const shadowCss = `box-shadow: ${sx}px ${sy}px ${blur}px ${spd}px rgba(${r}, ${g}, ${b}, ${op});`;
    const radiusCss = `border-radius: ${tl}px ${tr}px ${br}px ${bl}px;`;

    box.style.boxShadow = `${sx}px ${sy}px ${blur}px ${spd}px rgba(${r}, ${g}, ${b}, ${op})`;
    box.style.borderRadius = `${tl}px ${tr}px ${br}px ${bl}px`;

    document.getElementById('codeText').textContent = `.element {\n  ${shadowCss}\n  ${radiusCss}\n}`;
  }

  function copyCode() {
    navigator.clipboard.writeText(document.getElementById('codeText').textContent);
    alert('CSS copied to clipboard!');
  }

  update();
  </script>
