<!DOCTYPE html>
<html lang="en" data-theme="dark" data-tool-id="pdf-unlock">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <title>Unlock PDF — Remove PDF Password Free Online | SmartImgKit</title>
  <meta name="description" content="Remove password protection from your PDF files for free, locally in your browser, no upload required.">
  <link rel="canonical" href="https://smartimgkit.com/tools/pdf-unlock">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css?v=10">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .tool-workspace { max-width: 900px; margin: 0 auto; padding: 24px; }
    .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 48px 24px; text-align: center; cursor: pointer; margin-bottom: 24px; }
    .upload-area:hover { border-color: var(--accent); }
    .controls { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .control-row { margin-bottom: 16px; }
    .control-row label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-secondary); }
    .control-row input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; background: var(--accent); color: white; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="top"><div class="top-inner"><a href="/" class="logo">SmartImgKit</a></div></div>
  <main class="tool-workspace">
    <h1>Unlock PDF — Remove Password Protection</h1>
    <p style="color:var(--text-secondary);margin-bottom:24px">Remove password lock from your PDF locally, 100% private, no upload to any server.</p>
    <div class="upload-area" id="uploadArea"><div style="font-size:3rem;margin-bottom:16px">🔓</div><p>Drop password-protected PDF here</p><input type="file" id="fileInput" accept=".pdf" hidden></div>
    <div class="controls" id="controls" style="display:none">
      <div class="control-row"><label>Enter current PDF password</label><input type="password" id="password" placeholder="Current PDF password"></div>
      <button class="btn" id="unlockBtn">Unlock PDF</button>
    </div>
  </main>
  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => document.getElementById('controls').style.display='block');
  </script>
</body>
</html>
