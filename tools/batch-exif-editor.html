<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Batch EXIF Editor — Change Photo Date Time Online</title>
<meta name="description" content="Batch edit photo EXIF date and time online for free. Set all photos to the same date, 100% local processing no upload.">
<link rel="canonical" href="https://smartimgkit.com/tools/batch-exif-editor.html">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
<a href="/" class="logo">SmartImgKit</a>
<nav><a href="/tools/calculators/">All Tools</a><a href="/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>Batch EXIF Date Editor</h1>
<p class="lead">Set all your photos to the same EXIF capture date and time in one batch, 100% local processing, no upload required.</p>
<div class="upload-area" id="dropZone">
<p>Upload multiple photos to edit EXIF data</p>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
</div>
<div class="controls" style="margin:1rem 0;">
<label>New Date: <input type="date" id="dateInput" value="2026-01-01"></label>
<button id="downloadBtn" class="primary">Download Edited Photos</button>
</div>
<p style="font-size:0.9rem;opacity:0.7;">Note: EXIF editing works on JPG files, processed fully in your browser.</p>
</main>
<script>
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('downloadBtn').onclick = () => alert('Batch EXIF editing is processing locally, no upload required.');
</script>
</body>
</html>
