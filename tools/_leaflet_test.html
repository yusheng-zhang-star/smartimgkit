<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leaflet Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { padding: 20px; }
    .test-container { width: 800px; height: 500px; border: 2px solid red; }
    #test-map { width: 100%; height: 100%; }
    /* Fix for global img max-width */
    #test-map img { max-width: none !important; }
  </style>
</head>
<body>
  <h1>Leaflet Test Page</h1>
  <p>Global CSS loaded: img { max-width: 100%; display: block; }</p>
  <div class="test-container">
    <div id="test-map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map('test-map').setView([36.639, 117.1425], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);
  </script>
</body>
</html>
