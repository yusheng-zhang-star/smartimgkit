  <script>
(function() {
  const contentType = document.getElementById('contentType');
  const textFields = document.getElementById('textFields');
  const wifiFields = document.getElementById('wifiFields');
  const emailFields = document.getElementById('emailFields');
  const phoneFields = document.getElementById('phoneFields');
  const smsFields = document.getElementById('smsFields');
  const qrContainer = document.getElementById('qrContainer');
  const generateBtn = document.getElementById('generateBtn');
  const downloadPngBtn = document.getElementById('downloadPngBtn');
  const downloadSvgBtn = document.getElementById('downloadSvgBtn');
  
  let qrcode = null;

  function hideAllFields() {
    textFields.style.display = 'none';
    wifiFields.style.display = 'none';
    emailFields.style.display = 'none';
    phoneFields.style.display = 'none';
    smsFields.style.display = 'none';
  }

  contentType.addEventListener('change', () => {
    hideAllFields();
    const v = contentType.value;
    if (v === 'url' || v === 'text') textFields.style.display = 'block';
    else if (v === 'wifi') wifiFields.style.display = 'block';
    else if (v === 'email') emailFields.style.display = 'block';
    else if (v === 'phone') phoneFields.style.display = 'block';
    else if (v === 'sms') smsFields.style.display = 'block';
  });

  function getContent() {
    const type = contentType.value;
    if (type === 'url' || type === 'text') return document.getElementById('qrText').value;
    if (type === 'wifi') {
      const ssid = document.getElementById('wifiSsid').value;
      const pass = document.getElementById('wifiPassword').value;
      const enc = document.getElementById('wifiEncryption').value;
      return `WIFI:T:${enc};S:${ssid};P:${pass};;`;
    }
    if (type === 'email') {
      const to = document.getElementById('emailTo').value;
      const sub = document.getElementById('emailSubject').value;
      return `mailto:${to}?subject=${encodeURIComponent(sub)}`;
    }
    if (type === 'phone') return `tel:${document.getElementById('phoneNumber').value}`;
    if (type === 'sms') {
      const num = document.getElementById('smsNumber').value;
      const msg = document.getElementById('smsMessage').value;
      return `SMSTO:${num}:${msg}`;
    }
    return '';
  }

  function generate() {
    const content = getContent();
    if (!content) { alert('Please enter some content.'); return; }
    const size = parseInt(document.getElementById('qrSize').value) || 300;
    const fg = document.getElementById('fgColor').value;
    const bg = document.getElementById('bgColor').value;
    
    qrContainer.innerHTML = '';
    qrcode = new QRCode(qrContainer, {
      text: content,
      width: size,
      height: size,
      colorDark: fg,
      colorLight: bg,
      correctLevel: QRCode.CorrectLevel.H
    });
  }

  generateBtn.addEventListener('click', generate);

  'qrcode.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  downloadSvgBtn.addEventListener('click', () => {
    const img = qrContainer.querySelector('img');
    if (!img) { alert('Generate a QR code first.'); return; }
    const svgSrc = img.src;
    if (svgSrc.startsWith('data:image/svg+xml')) {
      link = document.createElement('a');
      link.download = 'qrcode.svg';
      link.href = svgSrc;
      link.click();
    } 'qrcode.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    }
  });

  // Auto-generate on load
  generate();
})();
  </script>
