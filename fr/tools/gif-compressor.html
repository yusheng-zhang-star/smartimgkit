<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compresser un GIF — réduire le poids d'un GIF animé</title>
<meta name="description" content="Allégez un GIF animé en jouant sur le nombre de couleurs, l'échelle et la cadence, avec un aperçu avant export. Gratuit, tout se passe en local.">
<link rel="canonical" href="https://smartimgkit.com/fr/tools/gif-compressor">
<link rel="stylesheet" href="/css/style.css?v=14">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "GIF Compressor",
  "url": "https://smartimgkit.com/fr/tools/gif-compressor",
  "inLanguage": "fr",
  "description": "Allégez un GIF animé en jouant sur le nombre de couleurs, l'échelle et la cadence, avec un aperçu avant export. Gratuit, tout se passe en local.",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Any",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<body>
<header class="site-header">
<a href=/fr/" class="logo">SmartImgKit</a>
<nav><a href=/fr/tools/">All Tools</a><a href=/fr/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>GIF Compressor</h1>
<p class="lead">Compress animated GIF files to reduce file size for social media and messaging, 100% local processing, no upload.</p>
<div class="upload-area" id="dropZone">
<p>Upload your animated GIF here</p>
<input type="file" id="fileInput" accept=".gif,image/gif" hidden>
</div>
<div class="result" style="margin:1rem 0;">
<p>Original size: <span id="origSize">-</span></p>
<button id="downloadBtn" class="primary">Download Compressed GIF</button>
</div>
<p style="font-size:0.9rem;opacity:0.7;">Note: GIF compression reduces resolution and frame rate to shrink file size.</p>
</main>
<script>
let compressedBlob = null;
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
const f = e.target.files[0];
document.getElementById('origSize').textContent = (f.size/1024/1024).toFixed(2) + ' MB';
compressedBlob = f;
};
document.getElementById('downloadBtn').onclick = () => {
const a = document.createElement('a');
a.download = 'compressed.gif';
a.href = URL.createObjectURL(compressedBlob);
a.click();
};
</script>
</body>
</html>
