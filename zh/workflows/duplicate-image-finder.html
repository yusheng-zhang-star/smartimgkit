<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<title>重复图片查找器 - 查找相似照片免费 | SmartImgKit</title>
<meta name="description" content="在浏览器中查找重复和相似照片。使用感知哈希算法，批量处理。免费，不上传，保护隐私。">
<link rel="canonical" href="https://smartimgkit.com/zh/workflows/duplicate-image-finder">
<meta name="theme-color" content="#10b981">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="../../css/style.css?v=10">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2385875044602242" crossorigin="anonymous"></script>
<style>
.group{margin:1rem 0;padding:1rem;background:#1e293b;border-radius:12px}
.group h4{color:#fbbf24;margin-bottom:.5rem}
.group img{width:120px;height:120px;object-fit:cover;border-radius:8px;margin:.25rem}
</style>
</head>
<body>
<header class="site-header"><div class="container header-inner">
<a href="/" class="logo"><span class="logo-icon">🎨</span><span class="logo-text">SmartImgKit</span></a>
<nav class="main-nav"><a href="/">首页</a><a href="/tools/background-remover">工具</a><a href="/workflows/">工作流</a><a href="/blog/">博客</a><a href="/api">API</a><a href="/about">关于</a></nav>
</div></header>
<main class="tool-page"><div class="container">
<nav class="breadcrumb"><a href="/">首页</a><span>/</span><a href="/zh/workflows/">工作流</a><span>/</span><span>重复图片查找</span></nav>
<div class="tool-page-header"><h1>重复图片查找器</h1><p>查找重复和视觉相似的照片。使用感知哈希算法，能识别缩放、压缩和轻微编辑后的重复图片。</p></div>
<div class="upload-area" id="uploadArea"><input type="file" id="fileInput" accept="image/*" multiple hidden><div class="upload-icon">🗂️</div><h3>拖入要比较的图片</h3><p>或点击选择（批量）</p></div>
<div id="controls" style="display:none">
<label style="color:#94a3b8">相似度阈值：<span id="thVal">85%</span></label>
<input type="range" id="th" min="50" max="99" value="85" style="width:100%">
<button class="btn btn-primary" id="findBtn" style="margin-top:1rem">查找重复</button>
<div id="results"></div>
</div>
<p style="color:#94a3b8;margin-top:1rem">🔒 您的照片不会离开设备。</p>
</div></main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SmartImgKit</p></div></div></footer>
<script>
const $=id=>document.getElementById(id);let files=[];
$('uploadArea').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{files=Array.from(e.target.files);$('controls').style.display='block';};
$('th').oninput=()=>$('thVal').textContent=$('th').value+'%';
async function phash(file){return new Promise((resolve)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=8;c.height=8;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,8,8);const d=ctx.getImageData(0,0,8,8).data;const gray=[];for(let i=0;i<64;i++)gray.push(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]);const avg=gray.reduce((a,b)=>a+b,0)/64;resolve(gray.map(v=>v>avg?1:0).join(''));};img.src=URL.createObjectURL(file);});}
$('findBtn').onclick=async()=>{$('findBtn').disabled=true;$('findBtn').textContent='扫描中…';const hashes=await Promise.all(files.map(phash));const th=+$('th').value;const groups=[];const used=new Set();for(let i=0;i<files.length;i++){if(used.has(i))continue;const g=[i];used.add(i);for(let j=i+1;j<files.length;j++){if(used.has(j))continue;let diff=0;for(let k=0;k<64;k++)if(hashes[i][k]!==hashes[j][k])diff++;const sim=Math.round((1-diff/64)*100);if(sim>=th){g.push(j);used.add(j);}}if(g.length>1)groups.push(g);}if(!groups.length){$('results').innerHTML='<p style="color:#10b981">未发现重复图片！🎉</p>';}else{$('results').innerHTML=groups.map((g,i)=>`<div class="group"><h4>第${i+1}组（${g.length}张相似）</h4>${g.map(idx=>`<img src="${URL.createObjectURL(files[idx])}" title="${files[idx].name}">`).join('')}</div>`).join('');}$('findBtn').disabled=false;$('findBtn').textContent='查找重复';};
</script>
</body></html>
