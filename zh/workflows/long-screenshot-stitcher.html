<header class="site-header"><div class="container header-inner">

<nav class="breadcrumb"><a href="/">首页</a><span>/</span><a href="/zh/workflows/">工作流</a><span>/</span><span>长截图拼接器</span></nav>
<div class="tool-page-header"><h1>长截图拼接器</h1><p>将多张截图拼接成一张高长图。适合教程、聊天记录、网页长截图分享。纯浏览器处理，不上传，免费。</p></div>
<div class="upload-area" id="uploadArea"><input type="file" id="fileInput" accept="image/*" multiple hidden><div class="upload-icon">📱</div><h3>拖入截图（按从上到下顺序）</h3><p>或点击选择文件</p><p class="upload-hint">从上到下的顺序很重要</p></div>
<div id="controls" style="display:none">
<label style="color:#94a3b8">图片间距：<span id="gapVal">0</span>px</label>
<input type="range" id="gap" min="0" max="50" value="0" style="width:100%">
<button class="btn btn-primary" id="genBtn" style="margin-top:1rem">拼接并下载</button>
<div class="preview"><canvas id="canvas"></canvas></div>
</div>
<p style="color:#94a3b8;margin-top:1rem">🔒 您的截图不会离开设备。</p>
</div></main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SmartImgKit</p></div></div></footer>
<script>
const $=id=>document.getElementById(id);let imgs=[];
$('uploadArea').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{imgs=[];for(const f of e.target.files){const src=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});imgs.push(im);}$('controls').style.display='block';draw();};
$('gap').oninput=()=>{$('gapVal').textContent=$('gap').value;draw();};
function draw(){if(!imgs.length)return;const w=Math.max(...imgs.map(i=>i.width));const gap=+$('gap').value;const h=imgs.reduce((s,i)=>s+i.height,0)+gap*(imgs.length-1);const c=$('canvas'),ctx=c.getContext('2d');c.width=w;c.height=h;let y=0;for(const im of imgs){ctx.drawImage(im,0,y);y+=im.height+gap;}}
$('genBtn').onclick=()=>{const a=document.createElement('a');a.href=$('canvas').toDataURL('image/png');a.download='long-screenshot.png';a.click();};
</script>
