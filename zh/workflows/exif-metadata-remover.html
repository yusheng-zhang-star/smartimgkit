<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<title>照片EXIF信息清除 - 去除GPS位置免费 | SmartImgKit</title>
<meta name="description" content="分享照片前清除GPS位置、相机型号、拍摄时间等EXIF信息。保护隐私。纯浏览器处理，批量支持。">
<link rel="canonical" href="https://smartimgkit.com/zh/workflows/exif-metadata-remover">
<meta name="theme-color" content="#0ea5e9">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="../../css/style.css?v=10">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/js/jszip.min.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2385875044602242" crossorigin="anonymous"></script>
<style>
.file-list{margin:1rem 0}
.file-item{display:flex;align-items:center;gap:1rem;padding:.5rem;background:#1e293b;border-radius:8px;margin:.25rem 0}
.file-item img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.badge{padding:2px 8px;border-radius:4px;font-size:.75rem;background:#10b981;color:#000}
</style>
</head>
<body>
<header class="site-header"><div class="container header-inner">
<a href="/" class="logo"><span class="logo-icon">🎨</span><span class="logo-text">SmartImgKit</span></a>
<nav class="main-nav"><a href="/">首页</a><a href="/tools/background-remover">工具</a><a href="/workflows/">工作流</a><a href="/blog/">博客</a><a href="/api">API</a><a href="/about">关于</a></nav>
</div></header>
<main class="tool-page"><div class="container">
<nav class="breadcrumb"><a href="/">首页</a><span>/</span><a href="/zh/workflows/">工作流</a><span>/</span><span>EXIF信息清除</span></nav>
<div class="tool-page-header"><h1>EXIF信息清除</h1><p>分享照片前清除GPS位置、相机型号、拍摄时间等元数据。您的照片可能暴露拍摄位置和时间——一键清除。</p></div>
<div class="upload-area" id="uploadArea"><input type="file" id="fileInput" accept="image/*" multiple hidden><div class="upload-icon">🛡️</div><h3>拖入要清除的照片</h3><p>或点击选择（批量）</p></div>
<div id="controls" style="display:none">
<div class="file-list" id="fileList"></div>
<button class="btn btn-primary" id="cleanBtn">清除并下载ZIP</button>
</div>
<p style="color:#94a3b8;margin-top:1rem">🔒 文件在浏览器本地处理，不会上传。</p>
</div></main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SmartImgKit</p></div></div></footer>
<script>
const $=id=>document.getElementById(id);let files=[];
$('uploadArea').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{files=Array.from(e.target.files);$('fileList').innerHTML=files.map((f,i)=>`<div class="file-item"><img src="${URL.createObjectURL(f)}"><div><strong>${f.name}</strong><br><small style="color:#94a3b8">${(f.size/1024).toFixed(0)} KB</small></div><span class="badge">就绪</span></div>`).join('');$('controls').style.display='block';};
$('cleanBtn').onclick=async()=>{$('cleanBtn').disabled=true;$('cleanBtn').textContent='清除中…';const zip=new JSZip();for(const f of files){const blob=await new Promise(r=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);c.toBlob(r,'image/jpeg',0.92);};img.src=URL.createObjectURL(f);});zip.file(f.name.replace(/\.[^.]+$/,'')+'-clean.jpg',blob);}const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clean-photos.zip';a.click();$('cleanBtn').disabled=false;$('cleanBtn').textContent='清除并下载ZIP';};
</script>
</body></html>
