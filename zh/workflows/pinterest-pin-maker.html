<body>
<header class="site-header"><div class="container header-inner">
<a href="/" class="logo"><span class="logo-icon">🎨</span><span class="logo-text">SmartImgKit</span></a>
<nav class="main-nav"><a href="/">首页</a><a href="/tools/background-remover">工具</a><a href="/workflows/">工作流</a><a href="/blog/">博客</a><a href="/api">API</a><a href="/about">关于</a></nav>
</div></header>
<main class="tool-page"><div class="container">
<nav class="breadcrumb"><a href="/">首页</a><span>/</span><a href="/zh/workflows/">工作流</a><span>/</span><span>Pinterest Pin生成器</span></nav>
<div class="tool-page-header"><h1>Pinterest Pin生成器</h1><p>按Pinterest推荐比例（900x1350，2:3）制作Pin图。加标题文字，一键下载。</p></div>
<div class="upload-area" id="uploadArea"><input type="file" id="fileInput" accept="image/*" hidden><div class="upload-icon">📌</div><h3>上传主图</h3><p>或点击选择</p></div>
<div id="controls" style="display:none">
<div class="controls">
<div><label>标题文字</label><textarea id="title" rows="2">在这里输入标题</textarea></div>
<div><label>字体大小：<span id="fsVal">48</span>px</label><input type="range" id="fs" min="24" max="80" value="48"></div>
<div><label>文字颜色</label><input type="color" id="tc" value="#ffffff"></div>
<div><label>背景叠加透明度：<span id="ovVal">50%</span></label><input type="range" id="ov" min="0" max="100" value="50"></div>
</div>
<div class="preview"><canvas id="canvas"></canvas></div>
<button class="btn btn-primary" id="dlBtn">下载Pin图</button>
</div>
<p style="color:#94a3b8;margin-top:1rem">🔒 您的图片不会离开设备。</p>
</div></main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SmartImgKit</p></div></div></footer>
<script>
const $=id=>document.getElementById(id);let img=null;
$('uploadArea').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{const f=e.target.files[0];if(f){img=new Image();img.onload=()=>{draw();$('controls').style.display='block';};img.src=URL.createObjectURL(f);}};
function draw(){if(!img)return;const W=900,H=1350;const c=$('canvas'),ctx=c.getContext('2d');c.width=W;c.height=H;const ir=img.width/img.height,tr=W/H;let dw,dh;if(ir>tr){dw=W;dh=dw/ir;}else{dh=H;dw=dh*ir;}ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);const ov=+$('ov').value/100;ctx.fillStyle=`rgba(0,0,0,${ov})`;ctx.fillRect(0,H*0.6,W,H*0.4);ctx.fillStyle=$('tc').value;ctx.font=`bold ${+$('fs').value}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const words=$('title').value.split('');let line='',ly=H*0.7;for(const w of words){if(ctx.measureText(line+w).width>W*0.9&&line){ctx.fillText(line,W/2,ly);ly+=$('fs').value*1.4;line=w;}else line+=w;}if(line)ctx.fillText(line,W/2,ly);}
['title','fs','tc','ov'].forEach(id=>$(id).oninput=draw);
$('fs').oninput=()=>$('fsVal').textContent=$('fs').value;
$('ov').oninput=()=>$('ovVal').textContent=$('ov').value+'%';
$('dlBtn').onclick=()=>{const a=document.createElement('a');a.href=$('canvas').toDataURL('image/png');a.download='pinterest-pin.png';a.click();};
</script>
</body></html>
