<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胶片颗粒滤镜 — 在线给照片添加复古噪点</title>
<meta name="description" content="免费在线胶片颗粒滤镜。一键为照片添加复古胶片噪点质感，100% 本地处理，无需上传。">
<link rel="canonical" href="https://smartimgkit.com/zh/tools/film-grain">
<link rel="stylesheet" href=/zh/css/style.css">
</head>
<body>
<header class="site-header">
<a href=/zh/" class="logo">SmartImgKit</a>
<nav><a href=/zh/tools/">All Tools</a><a href=/zh/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>胶片颗粒滤镜</h1>
<p class="lead">一键为照片添加复古胶片颗粒和噪点质感，全程在浏览器本地处理，无需上传。</p>
<div class="upload-area" id="dropZone">
<p>上传照片，添加胶片颗粒</p>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<div class="controls" style="margin:1rem 0;">
<label>Grain Intensity: <input type="range" id="intensity" min="0" max="100" value="30"> <span id="intVal">30%</span></label>
<button id="downloadBtn" class="primary">下载加颗粒后的照片</button>
</div>
<canvas id="canvas" style="max-width:100%;border:1px solid #333;"></canvas>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{img.onload=()=>{canvas.width=img.width;canvas.height=img.height;draw();};img.src=ev.target.result;}; r.readAsDataURL(f);};
function draw() {
const intensity = parseInt(document.getElementById('intensity').value);
document.getElementById('intVal').textContent = intensity+'%';
ctx.drawImage(img,0,0);
const data = ctx.getImageData(0,0,canvas.width,canvas.height);
const d = data.data;
for(let i=0;i<d.length;i+=4){
const noise = (Math.random()-0.5)*intensity*2;
d[i] += noise; d[i+1] += noise; d[i+2] += noise;
}
ctx.putImageData(data,0,0);
}
document.getElementById('intensity').oninput = draw;
document.getElementById('downloadBtn').onclick = () => {const a=document.createElement('a');a.download='film-grain.jpg';a.href=canvas.toDataURL('image/jpeg');a.click();};
</script>
</body>
</html>
