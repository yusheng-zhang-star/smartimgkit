<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片反色 — 在线把照片变成底片效果</title>
<meta name="description" content="免费在线图片反色工具。一键把照片变成底片负片效果，100% 本地处理，无需上传。">
<link rel="canonical" href="https://smartimgkit.com/zh/tools/invert-image-colors">
<link rel="stylesheet" href=/zh/css/style.css">
</head>
<body>
<header class="site-header">
<a href=/zh/" class="logo">SmartImgKit</a>
<nav><a href=/zh/tools/">All Tools</a><a href=/zh/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>图片反色工具</h1>
<p class="lead">一键把照片变成底片反色效果，全程在浏览器本地处理，无需上传、无需注册。</p>
<div class="upload-area" id="dropZone">
<p>上传照片，进行反色处理</p>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<button id="downloadBtn" class="primary" style="margin:1rem 0;">下载反色照片</button>
<canvas id="canvas" style="max-width:100%;border:1px solid #333;"></canvas>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{const img=new Image(); img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0); const data=ctx.getImageData(0,0,canvas.width,canvas.height); const d=data.data; for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];} ctx.putImageData(data,0,0);};img.src=ev.target.result;}; r.readAsDataURL(f);};
document.getElementById('downloadBtn').onclick = () => {const a=document.createElement('a');a.download='inverted.png';a.href=canvas.toDataURL('image/png');a.click();};
</script>
</body>
</html>
