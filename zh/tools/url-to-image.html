<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页截图 — 输入网址生成整页高清图片</title>
<meta name="description" content="免费网页转图片工具。输入网址即可截取整页高清截图，下载为 PNG/JPG。适合保存网页内容或制作预览图，无需注册。">
<link rel="canonical" href="https://smartimgkit.com/zh/tools/url-to-image">
<link rel="stylesheet" href="/css/style.css?v=12">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<header class="site-header">
<a href="/zh/" class="logo">SmartImgKit</a>
<nav><a href="/zh/tools/">全部工具</a><a href="/zh/blog/">博客</a></nav>
</header>
<main class="container">
<h1>网页截图转图片</h1>
<p class="lead">输入网页地址即可截取整页截图，下载为高清 PNG 或 JPG。适合保存网页内容、制作预览图或存档页面。</p>
<div class="url-input-group" style="margin:2rem 0;">
<input type="url" id="urlInput" placeholder="https://example.com" style="width:70%;padding:0.8rem;font-size:1rem;">
<button id="captureBtn" class="primary">Capture Screenshot</button>
</div>
<div id="previewArea" style="margin:2rem 0;display:none;">
<h3>Preview:</h3>
<iframe id="previewFrame" style="width:100%;height:500px;border:1px solid #333;"></iframe>
<div style="margin-top:1rem;">
<button id="downloadPngBtn">Download PNG</button>
<button id="downloadJpgBtn">Download JPG</button>
</div>
</div>
<section class="faq">
<h2>常见问题</h2>
<details><summary>Can I capture any website?</summary><p>大多数公开网站都能截取。部分有严格 CORS 限制或需要登录的网站，在预览中可能无法正常加载。</p></details>
<details><summary>Is my data stored?</summary><p>不会，所有截图都直接在浏览器中处理，不会向我们的服务器发送任何数据。</p></details>
</section>
</main>
<script>
const urlInput = document.getElementById('urlInput');
const captureBtn = document.getElementById('captureBtn');
const previewArea = document.getElementById('previewArea');
const previewFrame = document.getElementById('previewFrame');
captureBtn.onclick = async () => {
let url = urlInput.value.trim();
if(!url.startsWith('http')) url = 'https://' + url;
previewFrame.src = url;
previewArea.style.display = 'block';
alert('Waiting for page to load fully, then you can download the screenshot.');
};
document.getElementById('downloadPngBtn').onclick = async () => {
const canvas = await html2canvas(previewFrame.contentDocument.body);
const link = document.createElement('a');
link.download = 'webpage-screenshot.png';
link.href = canvas.toDataURL('image/png');
link.click();
};
document.getElementById('downloadJpgBtn').onclick = async () => {
const canvas = await html2canvas(previewFrame.contentDocument.body);
const link = document.createElement('a');
link.download = 'webpage-screenshot.jpg';
link.href = canvas.toDataURL('image/jpeg', 0.9);
link.click();
};
</script>
</body>
</html>
