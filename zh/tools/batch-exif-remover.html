<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免费在线批量EXIF信息清除工具 一键删除照片隐私元数据</title>
<meta name="description" content="浏览器本地批量清除照片EXIF元数据，删除GPS位置、拍摄时间、设备信息，保护隐私，不上传图片，免费无限制。">
<link rel="canonical" href="https://smartimgkit.com/zh/tools/batch-exif-remover.html">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif;}
.top {background:#0d9488; color:white; padding:1rem;}
.top-inner {max-width:1000px; margin:0 auto; display:flex; align-items:center;}
.top a {color:white; text-decoration:none; margin-right:1.5rem;}
.container {max-width:1000px; margin:2rem auto; padding:2rem;}
.drop-area {border:2px dashed #5eead4; border-radius:12px; padding:3rem; text-align:center; background:#ecfeff; cursor:pointer; margin:1.5rem 0;}
button {background:#0d9488; color:white; border:none; padding:0.8rem 1.5rem; border-radius:8px; cursor:pointer; font-size:1rem;}
.loading {display:none; text-align:center; margin:1.5rem 0; font-size:1.2rem; color:#0d9488;}
.spinner {display:inline-block; width:24px; height:24px; border:3px solid #99f6e4; border-top:3px solid #0d9488; border-radius:50%; animation:spin 1s linear infinite; margin-right:0.5rem; vertical-align:middle;}
@keyframes spin {to {transform:rotate(360deg);}}
</style>
</head>
<body>
<nav class="top"><div class="top-inner">
<strong>SmartImgKit</strong>
<a href="/zh/">首页</a>
<a href="/#tools">所有工具</a>
<a href="/zh/blog/">博客</a>
</div></nav>
<main class="container">
<h1>批量清除照片EXIF元数据工具</h1>
<p style="margin:1rem 0; font-size:1.1rem; color:#475569;">批量上传照片，一键删除所有EXIF隐私信息（GPS位置、拍摄时间、相机型号），所有处理在浏览器本地完成，图片不上传服务器，适合发社交媒体前清理隐私。</p>

<div class="drop-area" id="dropArea">
<p style="font-size:1.2rem; color:#0d9488;">把多张照片拖到这里，或者点击上传</p>
<p style="color:#64748b; margin-top:0.5rem;">支持JPG/PNG，批量无限制，不上传服务器</p>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
</div>
<button id="processBtn" style="margin:1rem 0;">一键清除所有EXIF信息并下载</button>
<div class="loading" id="loading"><span class="spinner"></span>正在清除照片隐私元数据...</div>
</main>
<script>
const dropArea = document.getElementById('dropArea');
const fileInput = document.getElementById('fileInput');
const processBtn = document.getElementById('processBtn');
const loading = document.getElementById('loading');
let files = [];
dropArea.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => files = Array.from(e.target.files).filter(f => f.type.startsWith('image/')));
processBtn.addEventListener('click', async () => {
processBtn.disabled = true;
loading.style.display = 'block';
for (const file of files) {
const img = new Image();
img.src = URL.createObjectURL(file);
await new Promise(res => img.onload = res);
const canvas = document.createElement('canvas');
canvas.width = img.width;
canvas.height = img.height;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0);
const link = document.createElement('a');
link.download = `clean_${file.name}`;
link.href = canvas.toDataURL('image/png');
link.click();
}
loading.style.display = 'none';
processBtn.disabled = false;
alert('所有照片的EXIF信息已清除完成，已自动下载！');
});
</script>
</body>
</html>
