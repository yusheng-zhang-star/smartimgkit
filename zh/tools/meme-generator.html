<body>
<header class="site-header">
<a href="/zh/" class="logo">SmartImgKit</a>
<nav><a href="/zh/tools/">全部工具</a><a href="/zh/blog/">博客</a></nav>
</header>
<main class="container">
<h1>免费表情包制作</h1>
<p class="lead">在图片上下方添加黑边粗体白字，制作经典梗图表情包。全程在浏览器本地处理，无需上传，无水印。</p>
<div class="upload-area" id="dropZone">
<p>把梗图背景图拖到这里，或点击上传</p>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<div class="controls" style="margin:1rem 0;display:flex;gap:1rem;flex-wrap:wrap;">
<input type="text" id="topText" placeholder="Top text" style="padding:0.5rem;">
<input type="text" id="bottomText" placeholder="Bottom text" style="padding:0.5rem;">
<label>Font Size: <input type="range" id="fontSize" min="10" max="80" value="32"></label>
<button id="downloadBtn" class="primary">Download Meme</button>
</div>
<div class="canvas-container" style="text-align:center;">
<canvas id="canvas" style="max-width:100%;border:1px solid #333;display:none;"></canvas>
</div>
<section class="faq">
<h2>常见问题</h2>
<details><summary>Is the meme generator free?</summary><p>是的，完全免费：无水印、无需注册、无文件大小限制。</p></details>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.onclick = () => fileInput.click();
fileInput.onchange = (e) => {const f = e.target.files[0]; const r = new FileReader(); r.onload = (ev) => {img.onload = () => {canvas.width = img.width; canvas.height = img.height; canvas.style.display='block'; draw();}; img.src = ev.target.result;}; r.readAsDataURL(f);};
function draw() {
ctx.drawImage(img, 0, 0);
const size = parseInt(document.getElementById('fontSize').value);
ctx.font = `bold ${size}px Impact, sans-serif`;
ctx.textAlign = 'center';
ctx.lineWidth = size/10;
ctx.strokeStyle = 'black';
ctx.fillStyle = 'white';
const topText = document.getElementById('topText').value.toUpperCase();
const bottomText = document.getElementById('bottomText').value.toUpperCase();
ctx.strokeText(topText, canvas.width/2, size+10);
ctx.fillText(topText, canvas.width/2, size+10);
ctx.strokeText(bottomText, canvas.width/2, canvas.height-10);
ctx.fillText(bottomText, canvas.width/2, canvas.height-10);
}
document.getElementById('topText').oninput = draw;
document.getElementById('bottomText').oninput = draw;
document.getElementById('fontSize').oninput = draw;
document.getElementById('downloadBtn').onclick = () => {
const link = document.createElement('a');
link.download = 'meme.png';
link.href = canvas.toDataURL('image/png');
link.click();
};
</script>
