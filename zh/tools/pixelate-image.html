<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片打码 — 涂抹遮挡人脸、车牌等敏感信息</title>
<meta name="description" content="免费在线图片打码工具。涂抹即可给敏感人脸、文字、车牌加马赛克。100% 本地处理，无需上传、无需注册。">
<link rel="canonical" href="https://smartimgkit.com/zh/tools/pixelate-image">
<link rel="stylesheet" href=/zh/css/style.css">
</head>
<body>
<header class="site-header">
<a href=/zh/" class="logo">SmartImgKit</a>
<nav><a href=/zh/tools/">All Tools</a><a href=/zh/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>图片打码工具</h1>
<p class="lead">涂抹图片任意区域即可打上马赛克，适合遮挡人脸、车牌或敏感文字。全程在浏览器本地处理，文件不会上传。</p>
<div class="upload-area" id="dropZone">
<p>把图片拖到这里，或点击上传</p>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<div class="controls" style="margin:1rem 0;">
<label>Brush Size: <span id="brushSizeVal">30</span>px <input type="range" id="brushSize" min="10" max="100" value="30"></label>
<label>Pixel Level: <span id="pixelSizeVal">10</span>px <input type="range" id="pixelSize" min="2" max="30" value="10"></label>
<button id="undoBtn">Undo</button>
<button id="downloadBtn" class="primary">下载打码后的图片</button>
</div>
<div class="canvas-container" style="text-align:center;">
<canvas id="canvas" style="max-width:100%;border:1px solid #333;display:none;"></canvas>
</div>
<section class="faq">
<h2>常见问题</h2>
<details><summary>Is my image uploaded to a server?</summary><p>不会。所有打码都在你的浏览器本地完成，图片不会离开你的设备。</p></details>
<details><summary>Can I pixelate multiple areas?</summary><p>可以，想打码多少区域都行，还可以用撤销按钮恢复修改。</p></details>
</section>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = new Image();
let isDrawing = false;
let history = [];
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.onclick = () => fileInput.click();
dropZone.ondragover = (e) => {e.preventDefault(); dropZone.classList.add('dragover');};
dropZone.ondragleave = () => dropZone.classList.remove('dragover');
dropZone.ondrop = (e) => {e.preventDefault(); const file = e.dataTransfer.files[0]; loadImage(file);};
fileInput.onchange = (e) => loadImage(e.target.files[0]);
function loadImage(file) {
const reader = new FileReader();
reader.onload = (e) => {
img.onload = () => {
canvas.width = img.width;
canvas.height = img.height;
canvas.style.display = 'block';
ctx.drawImage(img, 0, 0);
saveHistory();
};
img.src = e.target.result;
};
reader.readAsDataURL(file);
}
function saveHistory() {
history.push(canvas.toDataURL());
if(history.length > 10) history.shift();
}
document.getElementById('undoBtn').onclick = () => {
if(history.length > 1) {
history.pop();
const prev = new Image();
prev.onload = () => ctx.drawImage(prev, 0, 0);
prev.src = history[history.length-1];
}
};
function getPos(e) {
const rect = canvas.getBoundingClientRect();
return {
x: (e.clientX - rect.left) * (canvas.width / rect.width),
y: (e.clientY - rect.top) * (canvas.height / rect.height)
};
}
canvas.onmousedown = (e) => {isDrawing = true; applyPixel(getPos(e));};
canvas.onmousemove = (e) => {if(isDrawing) applyPixel(getPos(e));};
canvas.onmouseup = () => {isDrawing = false; saveHistory();};
function applyPixel(pos) {
const brushSize = parseInt(document.getElementById('brushSize').value);
const pixelSize = parseInt(document.getElementById('pixelSize').value);
const x = pos.x - brushSize/2;
const y = pos.y - brushSize/2;
const w = brushSize;
const h = brushSize;
const imageData = ctx.getImageData(x, y, w, h);
const smallCanvas = document.createElement('canvas');
smallCanvas.width = pixelSize;
smallCanvas.height = pixelSize;
const smallCtx = smallCanvas.getContext('2d');
smallCtx.drawImage(canvas, x, y, w, h, 0, 0, pixelSize, pixelSize);
ctx.imageSmoothingEnabled = false;
ctx.drawImage(smallCanvas, 0, 0, pixelSize, pixelSize, x, y, w, h);
}
document.getElementById('downloadBtn').onclick = () => {
const link = document.createElement('a');
link.download = 'pixelated-image.png';
link.href = canvas.toDataURL('image/png');
link.click();
};
</script>
</body>
</html>
