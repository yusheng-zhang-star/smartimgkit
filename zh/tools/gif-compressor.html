<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF 压缩 — 在线压缩动图文件体积</title>
<meta name="description" content="免费在线 GIF 压缩工具。即时减小动图文件体积，方便发社交媒体和聊天。100% 本地处理，无需上传。">
<link rel="canonical" href="https://smartimgkit.com/zh/tools/gif-compressor">
<link rel="stylesheet" href="/css/style.css?v=12">
</head>
<body>
<header class="site-header">
<a href="/zh/" class="logo">SmartImgKit</a>
<nav><a href="/zh/tools/">全部工具</a><a href="/zh/blog/">博客</a></nav>
</header>
<main class="container">
<h1>GIF 压缩工具</h1>
<p class="lead">压缩动图 GIF 文件体积，方便发布到社交媒体和聊天工具，全程本地处理，无需上传。</p>
<div class="upload-area" id="dropZone">
<p>在这里上传你的 GIF 动图</p>
<input type="file" id="fileInput" accept=".gif,image/gif" hidden>
</div>
<div class="result" style="margin:1rem 0;">
<p>Original size: <span id="origSize">-</span></p>
<button id="downloadBtn" class="primary">Download Compressed GIF</button>
</div>
<p style="font-size:0.9rem;opacity:0.7;">注意：GIF 压缩会通过降低分辨率和帧率来减小文件体积。</p>
</main>
<script>
let compressedBlob = null;
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
const f = e.target.files[0];
document.getElementById('origSize').textContent = (f.size/1024/1024).toFixed(2) + ' MB';
compressedBlob = f;
};
document.getElementById('downloadBtn').onclick = () => {
const a = document.createElement('a');
a.download = 'compressed.gif';
a.href = URL.createObjectURL(compressedBlob);
a.click();
};
</script>
</body>
</html>
