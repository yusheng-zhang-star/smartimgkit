<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inverter cores de imagem — efeito negativo online</title>
<meta name="description" content="Inverta as cores de qualquer foto e crie efeito negativo em um clique. Grátis, no navegador e sem enviar imagens.">
<link rel="canonical" href="https://smartimgkit.com/pt/tools/invert-image-colors">
<link rel="stylesheet" href="/css/style.css?v=15">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Invert Image Colors",
  "url": "https://smartimgkit.com/pt/tools/invert-image-colors",
  "inLanguage": "pt",
  "description": "Inverta as cores de qualquer foto e crie efeito negativo em um clique. Grátis, no navegador e sem enviar imagens.",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Any",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<body>
<header class="site-header">
<a href="/pt/" class="logo">SmartImgKit</a>
<nav><a href="/pt/tools/">Todas as ferramentas</a><a href="/pt/blog/">Blog</a></nav>
</header>
<main class="container">
<h1>Invert Image Colors</h1>
<p class="lead">Invert any photo to negative style instantly, 100% local processing in your browser, no upload, no signup.</p>
<div class="upload-area" id="dropZone">
<p>Upload your photo to invert colors</p>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<button id="downloadBtn" class="primary" style="margin:1rem 0;">Download Inverted Photo</button>
<canvas id="canvas" style="max-width:100%;border:1px solid #333;"></canvas>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{const img=new Image(); img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0); const data=ctx.getImageData(0,0,canvas.width,canvas.height); const d=data.data; for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];} ctx.putImageData(data,0,0);};img.src=ev.target.result;}; r.readAsDataURL(f);};
document.getElementById('downloadBtn').onclick = () => {const a=document.createElement('a');a.download='inverted.png';a.href=canvas.toDataURL('image/png');a.click();};
</script>
</body>
</html>
