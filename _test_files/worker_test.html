<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Worker Test</title></head>
<body>
<h2>Cross-origin Worker construction test</h2>
<pre id="out">testing...</pre>
<script>
const out = document.getElementById('out');
function log(msg) { out.textContent += '\n' + msg; }
try {
  const w = new Worker('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
  log('WORKER OK: constructed');
  w.onmessage = (e) => log('worker message: ' + JSON.stringify(e.data).substring(0, 100));
  w.onerror = (e) => log('worker error: ' + e.message + ' ' + e.filename);
  // send a frame message
  w.postMessage({
    index: 0, last: true, canTransfer: false, width: 2, height: 2, delay: 10,
    repeat: 0, quality: 10, transparent: null, dither: false, globalPalette: false,
    data: new Uint8ClampedArray([255,0,0,255, 0,255,0,255, 0,0,255,255, 255,255,0,255])
  });
} catch (e) {
  log('WORKER FAIL: ' + e.message);
}
</script>
</body>
</html>
